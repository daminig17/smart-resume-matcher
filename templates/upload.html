{% extends "base.html" %}
{% block title %}Upload Resume{% endblock %}
{% block content %}
<div class="container card animate">
  <h2>📤 Upload Your Resume</h2>
  <form method="POST" enctype="multipart/form-data">
    <input type="file" name="resume" accept="application/pdf" required>
    <button type="submit" class="btn pulse">Upload</button>
  </form>
  <p class="muted">Only PDF format is allowed.</p>
</div>
{% endblock %}
